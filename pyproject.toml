[project]
name = "ragleakguard"
dynamic = ["version"]
description = "Security toolkit with bounded operator-snapshot Chroma detection."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Belle Chang" }]
keywords = ["llm", "rag", "vector-database", "security", "pii", "privacy", "ai-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
pinecone = ["pinecone-client>=4"]
chroma-snapshot = ["chromadb==1.5.9"]
# Python 3.9: pin spaCy<3.8 + numpy<2 so prebuilt wheels exist (newer spaCy needs a source build)
detect = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2", "spacy>=3.7,<3.8", "numpy<2"]
dev = ["pytest>=8", "faker>=25"]

[project.urls]
Homepage = "https://github.com/Agenvana/RAGLeakGuard"
Repository = "https://github.com/Agenvana/RAGLeakGuard"
Issues = "https://github.com/Agenvana/RAGLeakGuard/issues"
Changelog = "https://github.com/Agenvana/RAGLeakGuard/blob/main/docs/releases/0.1.1.md"

[project.scripts]
ragleakguard = "ragleakguard.cli:app"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ragleakguard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ragleakguard"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/ragleakguard",
  "/README.md",
  "/README.zh-TW.md",
  "/SECURITY.md",
  "/LICENSE",
  "/pyproject.toml",
  "/docs/releases/0.1.1.md",
]
